name: Run nf-test

on:
  push:
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "container/**"
      - "bin/**"
      - "assets/**"
      - "nf-test.config"
      - "nextflow_schema.json"
      - "nextflow.config"
      - "conf/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "main.nf"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "container/**"
      - "bin/**"
      - "assets/**"
      - "nf-test.config"
      - "nextflow_schema.json"
      - "nextflow.config"
      - "conf/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "main.nf"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        profile: [docker]

    name: nf-test (${{ matrix.profile }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pgscatalog/pgsc_calc:v3-alpha.2
          cache-from: type=gha,scope=pgsc-calc-amd64

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Nextflow 25.10.0
        uses: nf-core/setup-nextflow@v1
        with:
          version: "25.10.0"

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash -s 0.9.3
          sudo mv nf-test /usr/local/bin/

      - name: Run nf-test (${{ matrix.profile }})
        run: nf-test test --ci --profile test,${{ matrix.profile }}

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests/v3 -p "test_*.py"
