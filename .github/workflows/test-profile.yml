name: Run test profile

on:
  push:
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "container/**"
      - "bin/**"
      - "assets/**"
      - "nf-test.config"
      - "nextflow_schema.json"
      - "nextflow.config"
      - "conf/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "main.nf"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".dockerignore"
      - "container/**"
      - "bin/**"
      - "assets/**"
      - "nf-test.config"
      - "nextflow_schema.json"
      - "nextflow.config"
      - "conf/**"
      - "modules/**"
      - "subworkflows/**"
      - "workflows/**"
      - "main.nf"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        profile: [docker]

    name: Test profile (${{ matrix.profile }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pgscatalog/pgsc_calc:v3-alpha.2
          cache-from: type=gha,scope=pgsc-calc-amd64

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Nextflow 25.10.0
        uses: nf-core/setup-nextflow@v1
        with:
          version: "25.10.0"

      - name: Run via GitHub integration
        run: |
          nextflow run pgscatalog/pgsc_calc \
            -r ${{ github.sha }} \
            -profile test,${{ matrix.profile }}

      - name: Run local nextflow script (${{ matrix.profile }})
        run: |
          nextflow run main.nf \
            -profile test,${{ matrix.profile }}

      - name: Run offline staged regression tests
        env:
          V3_IMAGE: pgscatalog/pgsc_calc:v3-alpha.2
        run: |
          bash tests/v3/run.sh
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$PWD:/repo:ro" -v "$PWD/work/integration-v3:/work" -w /work \
            "$V3_IMAGE" bash -euc 'python /repo/tests/v3/rejections.py; python /repo/tests/v3/matrix.py'
