name: Build and push Docker Hub image

on:
  push:
    branches:
      - v3-alpha.2
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub image tag
        required: true
        default: v3-blob
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ inputs.tag || 'v3-blob' }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'v3-blob' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: pgscatalog/pgsc_calc:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=pgsc-calc-amd64
          cache-to: type=gha,mode=max,scope=pgsc-calc-amd64

      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published pgscatalog/pgsc_calc:%s\n\nDigest: %s\n' \
            "$IMAGE_TAG" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
