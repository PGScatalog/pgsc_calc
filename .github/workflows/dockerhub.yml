name: Build and push Docker Hub image

on:
  push:
    branches:
      - v3-alpha.2
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub image tag
        required: true
        default: v3-blob
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ inputs.tag || 'v3-blob' }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'v3-blob' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHB_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=pgscatalog/pgsc_calc,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pgsc-calc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pgsc-calc-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHB_PASSWORD }}

      - name: Publish and inspect manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          images=()
          for digest in *; do
            images+=("pgscatalog/pgsc_calc@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "pgscatalog/pgsc_calc:$IMAGE_TAG" "${images[@]}"
          docker buildx imagetools inspect "pgscatalog/pgsc_calc:$IMAGE_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
